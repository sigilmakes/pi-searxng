services:
  redis:
    container_name: searxng-redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    user: "0:0"
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8042:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./engines/pw_common.py:/usr/local/searxng/searx/engines/pw_common.py:ro
      - ./engines/google_pw.py:/usr/local/searxng/searx/engines/google_pw.py:ro
      - ./engines/ddg_pw.py:/usr/local/searxng/searx/engines/ddg_pw.py:ro
      - ./engines/brave_pw.py:/usr/local/searxng/searx/engines/brave_pw.py:ro
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8042/
      - SEARXNG_RENDER_URL=http://host.docker.internal:8118/render
      - FORCE_OWNERSHIP=false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:

volumes:
  valkey-data:
  searxng-data:
