# see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings: true

server:
    secret_key: "bfd0fa3ca92f9af6ed6fa6fa5dd2896b5bba4a569129492b4244a1092dedcb9c"
    limiter: false
    image_proxy: true
    method: "GET"

search:
    formats:
        - html
        - json

redis:
    url: redis://searxng-redis:6379/0

outgoing:
    # Reduce suspension times so engines recover faster
    ban_time_on_fail: 2
    max_ban_time_on_fail: 60
    suspended_times:
        SearxEngineAccessDenied: 60
        SearxEngineCaptcha: 300
        SearxEngineTooManyRequests: 60

# Enable engines that work reliably for self-hosted instances
engines:
    # --- Browser-rendered general search engines ---
    # These are offline engines: SearXNG calls the local render server
    # instead of scraping search engines with plain HTTP.
    - name: google playwright
      engine: google_pw
      shortcut: gpw
      disabled: false
      categories:
        - general
        - web

    - name: duckduckgo playwright
      engine: ddg_pw
      shortcut: ddgpw
      disabled: false
      categories:
        - general
        - web

    - name: brave playwright
      engine: brave_pw
      shortcut: brpw
      disabled: true
      categories:
        - general
        - web

    # --- General search: reliable plain HTTP engines ---
    - name: bing
      engine: bing
      shortcut: bi
      disabled: false

    - name: mojeek
      engine: mojeek
      shortcut: mjk
      disabled: true

    - name: qwant
      engine: qwant
      shortcut: qw
      disabled: true

    - name: startpage
      engine: startpage
      disabled: true

    # --- Disable the repeat offenders that just get suspended ---
    - name: google
      engine: google
      disabled: true

    - name: duckduckgo
      engine: duckduckgo
      disabled: true

    - name: brave
      engine: brave
      disabled: true

    # --- Brave API (requires key, set via BRAVE_API_KEY env or here) ---
    # Free tier: 2000 queries/month. Sign up at https://brave.com/search/api/
    # - name: braveapi
    #   engine: braveapi
    #   api_key: ""
    #   shortcut: bra